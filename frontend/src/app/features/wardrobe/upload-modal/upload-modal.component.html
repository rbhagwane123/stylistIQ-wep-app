<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white w-[420px] rounded-xl shadow-lg p-6 relative">

        <!-- Close -->
        <button class="absolute top-3 right-3 text-xl cursor-pointer" (click)="close.emit()">
            ✕
        </button>

        <h2 class="text-xl font-semibold mb-4 text-center">
            Upload Outfit Image
        </h2>

        <!-- Upload Area -->
        <div class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer hover:border-[#FF7F50]"
            (click)="fileInput.click()" *ngIf="!previewUrl">
            <p class="text-gray-500">Click to upload image</p>
            <input type="file" accept="image/*" hidden #fileInput (change)="onFileSelected($event)" />
        </div>

        <!-- Preview -->
        <div *ngIf="previewUrl" class="space-y-4">
            <img [src]="previewUrl" class="w-full h-56 object-contain rounded-md border" />

            <div class="flex justify-between gap-3">
                <button class="flex-1 bg-gray-200 py-2 rounded-md cursor-pointer" (click)="removeImage()">
                    Remove
                </button>

                <button class="flex-1 bg-[#FF7F50] text-white py-2 rounded-md cursor-pointer"
                    (click)="removeBackground()">
                    Remove BG
                </button>
            </div>
        </div>

    </div>
</div>
