<div class="p-8">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-3xl font-normal">E-Wardrobe</h1>
            <p class="text-gray-500 mt-1 font-normal text-base">
                Manage your digital closet. Add, edit, or remove items.
            </p>
        </div>

        <button class="flex items-center gap-2 bg-[#FF7F50] text-white px-5 py-2.5 rounded-lg
             hover:bg-[#ff6a3c] transition cursor-pointer shadow-sm" (click)="handleUplaodModal()">
            <span class="text-xl">+</span>
            Upload Outfit
        </button>

        <!-- Modal -->
        <app-upload-modal *ngIf="showUploadModal" (close)="handleUplaodModal()"></app-upload-modal>
    </div>

    <!-- Filters -->
    <div class="flex gap-4 mb-8">
        <select class="border rounded-lg px-4 py-2 text-sm focus:outline-none bg-white">
            <option>Filter by Type</option>
            <option>Outerwear</option>
            <option>Bottom</option>
            <option>Shoes</option>
        </select>

        <select class="border rounded-lg px-4 py-2 text-sm focus:outline-none bg-white">
            <option>Filter by Color</option>
            <option>Beige</option>
            <option>Black</option>
            <option>Blue</option>
            <option>Multicolor</option>
        </select>
    </div>

    <!-- Wardrobe Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">

        <!-- Card -->
        <div class="relative group bg-white rounded-xl shadow-sm hover:shadow-lg
             transition overflow-hidden cursor-pointer" *ngFor="let wardrobe of wardrobeItems">

            <!-- Image -->
            <img [src]="wardrobe.imageUrl" class="h-64 w-full object-cover transition-transform duration-500
               group-hover:scale-105" alt="Beige Trench Coat" />

            <!-- Hover Menu -->
            <div class="absolute top-4 right-4 bg-white rounded-lg shadow-lg
               opacity-0 group-hover:opacity-100 transition
               scale-95 group-hover:scale-100">

                <button class="flex items-center gap-2 px-4 py-2 text-sm hover:bg-gray-100 w-full">
                    ✏️ Edit
                </button>

                <button class="flex items-center gap-2 px-4 py-2 text-sm text-red-500
                 hover:bg-red-50 w-full">
                    🗑 Delete
                </button>
            </div>

            <!-- Content -->
            <div class="p-4">
                <h3 class="font-semibold">Beige Trench Coat</h3>
                <p class="text-sm text-gray-500">{{wardrobe.primaryColor}} • {{wardrobe.secondaryColor}}</p>
            </div>
        </div>

    </div>
</div>
